name: m3tal
arch: amd64
platform: linux
version: ${VERSION}

section: utils
priority: optional
maintainer: Jake Johnson <jake@m3tal.io>
description: |
  M3TAL Core — embedded Web GUI dashboard, system monitor, settings, GPU telemetry, and plugin host.
  All workload features are provided by external plugins.
license: MIT

contents:
  - src: ./m3tal-api
    dst: /usr/bin/m3tal-api
    type: "file"

  - src: ./gui/dist
    dst: /usr/share/m3tal/gui

  - src: ./.env.example
    dst: /etc/m3tal/.env.example
    type: "config"

  - src: ./VERSION
    dst: /etc/m3tal/VERSION
    type: "config"

  - src: ./VERSION
    dst: /usr/share/m3tal/VERSION
    type: "file"

  - src: ./packaging/m3tal-api.service
    dst: /lib/systemd/system/m3tal-api.service
    type: "config"

  - src: ./docs/goback_logo.svg
    dst: /usr/share/icons/hicolor/scalable/apps/m3tal.svg
    type: "file"

  - src: ./docs/goback_logo.svg
    dst: /usr/share/pixmaps/m3tal.svg
    type: "file"

  - src: ./packaging/m3tal.desktop
    dst: /usr/share/applications/m3tal.desktop
    type: "file"

scripts:
  postinstall: ./scripts/postinstall.sh
  postremove: ./scripts/postremove.sh

deb:
  triggers:
    interest_noawait:
      - /usr/lib/m3tal/plugins
