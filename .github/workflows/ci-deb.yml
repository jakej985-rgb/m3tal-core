name: M3TAL Core CI - DEB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'gui/package-lock.json'
    - name: Build GUI assets for Go embed
      run: |
        cd gui
        npm ci
        npm run build
    - name: Set up Go
      uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Verify dependencies
      run: go mod verify
    - name: Check Go formatting
      run: |
        files=$(gofmt -s -l $(git ls-files '*.go'))
        if [ -n "$files" ]; then
          echo "$files"
          exit 1
        fi
    - name: Run Go tests
      run: go test -v ./...
    - name: Install nfpm
      run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
    - name: Build and test nfpm package
      run: |
        PACKAGER=nfpm DEB_TARGET=m3tal_nfpm_amd64.deb ./scripts/build-deb.sh
        ./scripts/test-pkg.sh m3tal_nfpm_amd64.deb
    - name: Build dpkg-deb fallback package
      run: |
        PACKAGER=dpkg-deb DEB_TARGET=m3tal_fallback_amd64.deb ./scripts/build-deb.sh
    - name: Compare package contents and metadata
      run: |
        set -euo pipefail
        nfpm_dir=$(mktemp -d)
        fallback_dir=$(mktemp -d)
        trap 'rm -rf "$nfpm_dir" "$fallback_dir"' EXIT
        dpkg-deb -x m3tal_nfpm_amd64.deb "$nfpm_dir"
        dpkg-deb -x m3tal_fallback_amd64.deb "$fallback_dir"
        (cd "$nfpm_dir" && find . -type l -printf '%P -> %l\n' | sort) > /tmp/nfpm-links
        (cd "$fallback_dir" && find . -type l -printf '%P -> %l\n' | sort) > /tmp/fallback-links
        diff -u /tmp/nfpm-links /tmp/fallback-links
        (cd "$nfpm_dir" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/nfpm-files
        (cd "$fallback_dir" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/fallback-files
        diff -u /tmp/nfpm-files /tmp/fallback-files
        dpkg-deb -e m3tal_nfpm_amd64.deb /tmp/nfpm-control
        dpkg-deb -e m3tal_fallback_amd64.deb /tmp/fallback-control
        for control_file in conffiles postinst postrm; do
          diff -u "/tmp/nfpm-control/$control_file" "/tmp/fallback-control/$control_file"
        done
        nfpm_package=m3tal_nfpm_amd64.deb
        fallback_package=m3tal_fallback_amd64.deb
        for field in Package Version Architecture Section Priority Maintainer Depends Recommends Description; do
          test "$(dpkg-deb -f "$nfpm_package" "$field")" = "$(dpkg-deb -f "$fallback_package" "$field")"
        done
        test "$(dpkg-deb -f "$nfpm_package" Package)" = m3tal
        test "$(dpkg-deb -f "$nfpm_package" Architecture)" = amd64
        test "$(dpkg-deb -f "$nfpm_package" Recommends)" = xdotool
        test "$(dpkg-deb -f "$nfpm_package" Version)" = "$(cat VERSION | tr -d '[:space:]' | sed 's/^v//')"
