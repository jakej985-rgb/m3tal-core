name: M3tal Documentation Sync

on:
  push:
    branches: [ main, dev ]
    paths:
      - README.md
      - docs/GET_STARTED.md
      - docs/ENVIRONMENT_VARIABLES.md
      - docs/COMMAND_REFERENCE.md
      - docs/OPERATIONS.md
      - docs/PLUGIN_AUTHORING.md
      - docs/SECURITY.md
      - docs/DEVELOPMENT.md
      - docs/RELEASE.md
  pull_request:
    branches: [ main ]
    paths:
      - README.md
      - docs/GET_STARTED.md
      - docs/ENVIRONMENT_VARIABLES.md
      - docs/COMMAND_REFERENCE.md
      - docs/OPERATIONS.md
      - docs/PLUGIN_AUTHORING.md
      - docs/SECURITY.md
      - docs/DEVELOPMENT.md
      - docs/RELEASE.md

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify curated documentation exists
        run: |
          set -euo pipefail
          for file in \
            README.md \
            docs/GET_STARTED.md \
            docs/ENVIRONMENT_VARIABLES.md \
            docs/COMMAND_REFERENCE.md \
            docs/OPERATIONS.md \
            docs/PLUGIN_AUTHORING.md \
            docs/SECURITY.md \
            docs/DEVELOPMENT.md \
            docs/RELEASE.md; do
            test -s "$file"
          done

  sync-docs-repo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out m3tal-docs repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jakej985-rgb/m3tal-docs
          token: ${{ secrets.GH_PAT }}
          path: m3tal-docs
          fetch-depth: 0

      - name: Check out M3tal-core docs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: m3tal-core

      - name: Sync curated documentation
        run: |
          set -euo pipefail
          mkdir -p m3tal-docs/projects/m3tal-core
          cp m3tal-core/README.md m3tal-docs/projects/m3tal-core/README.md
          cp m3tal-core/docs/GET_STARTED.md m3tal-docs/projects/m3tal-core/INSTALL.md
          cp m3tal-core/docs/ENVIRONMENT_VARIABLES.md m3tal-docs/projects/m3tal-core/CONFIG.md
          cp m3tal-core/docs/COMMAND_REFERENCE.md m3tal-docs/projects/m3tal-core/API.md
          cp m3tal-core/docs/OPERATIONS.md m3tal-docs/projects/m3tal-core/OPERATIONS.md
          cp m3tal-core/docs/PLUGIN_AUTHORING.md m3tal-docs/projects/m3tal-core/PLUGIN_AUTHORING.md
          cp m3tal-core/docs/SECURITY.md m3tal-docs/projects/m3tal-core/SECURITY.md
          cp m3tal-core/docs/DEVELOPMENT.md m3tal-docs/projects/m3tal-core/DEVELOPMENT.md
          cp m3tal-core/docs/RELEASE.md m3tal-docs/projects/m3tal-core/RELEASE.md

      - name: Commit documentation changes
        working-directory: m3tal-docs
        run: |
          set -euo pipefail
          git config user.name "m3tal-docs-bot"
          git config user.email "actions@github.com"
          git add projects/m3tal-core/
          if git diff --staged --quiet; then
            echo "No documentation changes to sync."
            exit 0
          fi
          git commit -m "docs: sync curated M3tal Core documentation [skip ci]"
          git pull --rebase
          git push
