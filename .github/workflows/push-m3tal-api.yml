name: Publish m3tal API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout m3tal-core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "m3tal Bot"
          git config --global user.email "actions@github.com"

      - name: Split API subtree
        run: |
          git subtree split --prefix=api -b api-publish

      - name: Push to m3tal-api
        env:
          TOKEN: ${{ secrets.API_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE=https://github.com/jakej985-rgb/m3tal-api.git
          # Authenticate via an ephemeral extraheader so the token never lands
          # in the remote URL or .git/config.
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          # Force-with-lease against the observed remote tip: the push fails
          # if m3tal-api main moved between the check and the update.
          REMOTE_SHA=$(git -c "http.extraheader=Authorization: Basic $AUTH" ls-remote "$REMOTE" refs/heads/main | awk '{print $1}')
          if [ -n "$REMOTE_SHA" ]; then
            LEASE="--force-with-lease=refs/heads/main:$REMOTE_SHA"
          else
            LEASE="--force-with-lease=refs/heads/main:"
          fi
          git -c "http.extraheader=Authorization: Basic $AUTH" push "$LEASE" "$REMOTE" api-publish:main
