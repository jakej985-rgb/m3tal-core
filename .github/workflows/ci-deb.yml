name: M3TAL Core CI - DEB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test-go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Go
      uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
      with:
        go-version: '1.23'
        cache: false
    - name: Verify dependencies
      run: go mod verify
    - name: Create Mock GUI Dist
      # TODO:replace-when-gui-built
      run: |
        mkdir -p gui/dist
        echo "placeholder" > gui/dist/index.html
      # END TODO:replace-when-gui-built
    - name: Build CLI
      run: go build -v -o m3tal ./cli
    - name: Build API
      run: go build -v -o m3tal-api ./api/cmd
    - name: Run tests
      run: go test -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Go
      uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
      with:
        go-version: '1.23'
        cache: false
    - name: Go Format Check
      run: |
        if [ "$(gofmt -s -l . | grep -v vendor | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted correctly:"
          gofmt -s -l . | grep -v vendor
          exit 1
        fi
