name: Build and Publish DEB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-deb:
    runs-on: ubuntu-latest
    env:
      VERSION: ""
      TAG: ""
      CLEAN_VERSION: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Ensure Unique Version
        id: check_version
        run: |
          git fetch --tags
          RAW_VERSION=$(cat VERSION 2>/dev/null || echo "0.1.0")
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//')
          TAG="v${CLEAN_VERSION}"

          # Never rebuild or replace assets for an already-used release tag.
          # A rerun for the same commit could produce different package bytes.
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-parse "$TAG^{commit}" 2>/dev/null || true)
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" = "$HEAD_COMMIT" ]; then
              echo "::error::Release tag $TAG already points to this commit; refusing to rebuild or replace its assets. Bump VERSION to publish a new release."
              exit 1
            elif [ -n "$TAG_COMMIT" ]; then
              echo "⚠️ Tag $TAG already exists on commit $TAG_COMMIT (current HEAD is $HEAD_COMMIT)! Auto-bumping semantic version..."
              ./scripts/bump-version.sh auto
              TAG=$(cat VERSION | tr -d '[:space:]')
              CLEAN_VERSION=$(echo "$TAG" | sed 's/^v//')

              git config --global user.name "github-actions[bot]"
              git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add VERSION CHANGELOG.md gui/package.json pkg/version/version.go
              git commit -m "chore(release): auto-bump version to $TAG [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

          echo "VERSION=$TAG" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'gui/package-lock.json'

      - name: Build GUI assets for Go embed
        run: |
          cd gui
          npm ci
          npm run build

      - name: Verify dependencies and tests
        run: |
          go mod verify
          go test ./...

      - name: Check Go formatting
        run: |
          files=$(gofmt -s -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg2 dpkg-dev python3-yaml
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build .deb package
        run: ./scripts/build-deb.sh

      - name: Verify Built Deb Asset
        run: |
          DEB_FILE="m3tal_${CLEAN_VERSION}_amd64.deb"
          test -s "$DEB_FILE"
          echo "Successfully built $DEB_FILE ($(du -h "$DEB_FILE" | cut -f1))"
          test "$(dpkg-deb -f "$DEB_FILE" Package)" = m3tal
          test "$(dpkg-deb -f "$DEB_FILE" Version)" = "$CLEAN_VERSION"
          test "$(dpkg-deb -f "$DEB_FILE" Architecture)" = amd64
          test "$TAG" = "v$CLEAN_VERSION"

      - name: Test Debian package and AVX-less API startup
        run: ./scripts/test-pkg.sh "m3tal_${CLEAN_VERSION}_amd64.deb"

      - name: Record tested package checksum
        id: checksum
        run: |
          DEB_FILE="m3tal_${CLEAN_VERSION}_amd64.deb"
          sha256sum "$DEB_FILE" > "$DEB_FILE.sha256"
          echo "sha256=$(sha256sum "$DEB_FILE" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            m3tal_${{ env.CLEAN_VERSION }}_amd64.deb
            m3tal_${{ env.CLEAN_VERSION }}_amd64.deb.sha256
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Publish to Central APT Repository (m3tal-apt-key)
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          repository: jakej985-rgb/m3tal-apt-key
          event-type: publish-deb
          client-payload: >-
            {
              "package_id": "m3tal",
              "repo": "${{ github.repository }}",
              "version": "${{ env.CLEAN_VERSION }}",
              "tag": "${{ env.TAG }}",
              "deb_url": "https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/m3tal_${{ env.CLEAN_VERSION }}_amd64.deb",
              "sha256": "${{ steps.checksum.outputs.sha256 }}",
              "allow_replace": false
            }

      - name: Checkout M3tal-Hub
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jakej985-rgb/M3tal-Hub
          token: ${{ secrets.GH_PAT }}
          path: m3tal-hub
          fetch-depth: 0

      - name: Sync Version and Changelog to M3tal-Hub
        run: |
          python3 scripts/sync_hub_manifest.py \
            --manifest m3tal-hub/apps/manifest.yml \
            --version "${{ env.CLEAN_VERSION }}" \
            --tag "${{ env.TAG }}"

      - name: Commit and Push to M3tal-Hub
        run: |
          cd m3tal-hub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/manifest.yml
          if git diff --staged --quiet; then
            echo "No changes in M3tal-Hub manifest."
          else
            git commit -m "feat(hub): sync m3tal-core ${CLEAN_VERSION} version and changelog [skip ci]"
            git push origin main
            echo "✅ Successfully synced version and changelog to M3tal-Hub!"
          fi
          cd ..

      - name: Import GPG key (for plugin catalog signing)
        uses: crazy-max/ghaction-import-gpg@01dd5d3ca463c7f10f7f4f7b4f177225ac661ee4 # v6.1.0
        continue-on-error: true
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Checkout m3tal-plugins repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jakej985-rgb/m3tal-plugins
          token: ${{ secrets.GH_PAT }}
          path: plugin-repo
          fetch-depth: 0
        continue-on-error: true

      - name: Generate and Sign Plugin Catalog
        if: hashFiles('plugin-repo') != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          python3 scripts/generate_catalog.py --output plugin-repo/catalog.json
          
          # Detect available signing key
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons 2>/dev/null | grep '^fpr:' | head -n1 | cut -d: -f10 || true)
          if [ -n "$GPG_KEY_ID" ]; then
            GPG_OPTS="-u $GPG_KEY_ID"
            if [ -n "$GPG_PASSPHRASE" ]; then
                GPG_OPTS="$GPG_OPTS --batch --yes --pinentry-mode loopback --passphrase $GPG_PASSPHRASE"
            fi
            rm -f plugin-repo/catalog.json.sig
            gpg --batch --no-tty $GPG_OPTS -abs -o plugin-repo/catalog.json.sig plugin-repo/catalog.json || true
          fi
          touch plugin-repo/.nojekyll

      - name: Deploy Plugins to GitHub Pages
        if: hashFiles('plugin-repo') != ''
        run: |
          cd plugin-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json catalog.json.sig .nojekyll 2>/dev/null || git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit in plugin repo."
          else
            git commit -m "chore(plugins): update plugin catalog for m3tal-core ${CLEAN_VERSION} [skip ci]"
            git push origin main
          fi
          cd ..

      - name: Verify signed central APT index and published package
        timeout-minutes: 20
        env:
          EXPECTED_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          REPO_URL=https://jakej985-rgb.github.io/m3tal-apt-key
          curl --fail --location "$REPO_URL/public.key" --output "$RUNNER_TEMP/m3tal-public.key"
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/m3tal-public.key" \
            | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = 5F84FE50A40111C981410E11775AD1473BF25102
          gpg --batch --yes --dearmor \
            --output "$RUNNER_TEMP/m3tal-archive-keyring.gpg" \
            "$RUNNER_TEMP/m3tal-public.key"
          sudo install -D -m 0644 "$RUNNER_TEMP/m3tal-archive-keyring.gpg" \
            /etc/apt/keyrings/m3tal-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/m3tal-archive-keyring.gpg] $REPO_URL stable main" \
            | sudo tee /etc/apt/sources.list.d/m3tal.list >/dev/null

          for attempt in $(seq 1 40); do
            if sudo apt-get update -qq && \
                apt-cache madison m3tal | awk '{print $3}' | grep -Fxq "$CLEAN_VERSION"; then
              download_dir="$RUNNER_TEMP/m3tal-apt-download"
              mkdir -p "$download_dir"
              cd "$download_dir"
              apt-get download "m3tal=$CLEAN_VERSION"
              package="m3tal_${CLEAN_VERSION}_amd64.deb"
              actual_sha256=$(sha256sum "$package" | cut -d ' ' -f1)
              if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
                echo "::error ::APT package SHA-256 $actual_sha256 does not match tested artifact $EXPECTED_SHA256."
                exit 1
              fi
              echo "Signed APT metadata advertises $CLEAN_VERSION and its package matches the tested SHA-256."
              exit 0
            fi
            echo "APT repository has not published $CLEAN_VERSION yet (attempt $attempt/40)."
            sleep 15
          done
          echo "::error ::Timed out waiting for the signed APT index to publish $CLEAN_VERSION."
          exit 1
